<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administração de Inscrições | PJM</title><link rel="stylesheet" href="../style.css"><style>
body{background:#f4f2eb;color:#12271f}.admin{max-width:1250px;margin:auto;padding:30px 18px 60px}.admin-head{background:#08251b;color:#fff;padding:22px;border-radius:6px;display:flex;justify-content:space-between;align-items:center;gap:15px}.admin-head img{width:55px;height:65px;object-fit:contain}.brand{display:flex;align-items:center;gap:15px}.brand h1{margin:0;font-size:25px}.muted{color:#6c7771}.toolbar{margin:18px 0;display:flex;gap:10px;flex-wrap:wrap}.toolbar input,.toolbar select,.toolbar button{padding:11px;border:1px solid #c8cec8;border-radius:5px;background:#fff}.toolbar input{min-width:250px}.table-wrap{overflow:auto;background:#fff;border:1px solid #d5d9d3}.table{width:100%;border-collapse:collapse;min-width:1000px}.table th,.table td{padding:12px;border-bottom:1px solid #e5e7e2;text-align:left;font-size:13px}.table th{background:#edf0eb}.status{padding:5px 8px;border-radius:12px;font-weight:800;font-size:11px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.metric{background:#fff;border:1px solid #ddd;padding:16px}.metric b{display:block;font-size:28px;color:#0b3a2a}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);padding:20px;z-index:10}.modal-box{background:#fff;max-width:900px;margin:30px auto;padding:25px;max-height:90vh;overflow:auto}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.detail{padding:12px;background:#f4f5f1}.detail b{display:block;font-size:11px;text-transform:uppercase;color:#66736d}.login{max-width:430px;margin:80px auto;background:#fff;padding:28px;border:1px solid #ddd}.login input{width:100%;box-sizing:border-box;padding:13px;margin:7px 0 14px}.danger{color:#a52c25}@media(max-width:800px){.cards{grid-template-columns:1fr 1fr}.detail-grid{grid-template-columns:1fr}.admin-head{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="admin">
<section id="login" class="login"><h1>PJM • Administração</h1><p class="muted">Área restrita para gestão das fichas de inscrição.</p><label>E-mail</label><input id="email" type="email"><label>Senha</label><input id="password" type="password"><button id="loginBtn" class="btn-form btn-primary">ENTRAR</button><p id="loginMsg" class="danger"></p></section>
<section id="dashboard" hidden><header class="admin-head"><div class="brand"><img src="../assets/brasao-comando-geral.png"><div><div style="color:#d7bb53;font-weight:800;letter-spacing:1px">PROJETO JOVEM MILITAR</div><h1>Central de Inscrições</h1></div></div><button id="logout" class="btn-form btn-gold">SAIR</button></header>
<div class="cards"><div class="metric"><span>Total</span><b id="mTotal">0</b></div><div class="metric"><span>Pendentes</span><b id="mPending">0</b></div><div class="metric"><span>Em análise</span><b id="mAnalysis">0</b></div><div class="metric"><span>Convocadas</span><b id="mCalled">0</b></div></div>
<div class="toolbar"><input id="search" placeholder="Buscar por nome, protocolo ou cidade"><select id="statusFilter"><option value="">Todos os status</option><option>Pendente</option><option>Em análise</option><option>Aprovada</option><option>Convocada</option><option>Concluída</option><option>Indeferida</option><option>Cancelada</option></select><select id="unitFilter"><option value="">Todas as unidades</option></select><button id="refresh" class="btn-form btn-secondary">ATUALIZAR</button></div>
<div class="table-wrap"><table class="table"><thead><tr><th>Protocolo</th><th>Data</th><th>Aluno</th><th>Idade</th><th>Unidade</th><th>Responsável</th><th>WhatsApp</th><th>Status</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section></main>
<div class="modal" id="modal"><div class="modal-box"><div style="display:flex;justify-content:space-between;gap:10px"><h2 id="detailTitle">Ficha</h2><button id="close" class="btn-form btn-secondary">FECHAR</button></div><div class="detail-grid" id="detailGrid"></div><hr><label><b>Status</b></label><select id="detailStatus"><option>Pendente</option><option>Em análise</option><option>Aprovada</option><option>Convocada</option><option>Concluída</option><option>Indeferida</option><option>Cancelada</option></select><label style="display:block;margin-top:14px"><b>Observação interna</b></label><textarea id="adminNotes" style="width:100%;min-height:110px;margin-top:7px"></textarea><button id="saveDetail" class="btn-form btn-gold" style="margin-top:14px">SALVAR ALTERAÇÕES</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script><script>
let client,current=null,all=[];const $=id=>document.getElementById(id);
function age(d){const b=new Date(d+'T00:00:00'),n=new Date();let a=n.getFullYear()-b.getFullYear();if(n.getMonth()<b.getMonth()||(n.getMonth()===b.getMonth()&&n.getDate()<b.getDate()))a--;return a}
function esc(s){return String(s??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
async function load(){const {data,error}=await client.from('inscricoes').select('*').order('criado_em',{ascending:false});if(error){alert(error.message);return}all=data||[];render()}
function render(){const q=$('search').value.toLowerCase(),st=$('statusFilter').value,u=$('unitFilter').value;let rows=all.filter(r=>(!q||[r.protocolo,r.nome_aluno,r.cidade,r.nome_responsavel].join(' ').toLowerCase().includes(q))&&(!st||r.status===st)&&(!u||r.unidade_interesse===u));$('mTotal').textContent=all.length;$('mPending').textContent=all.filter(x=>x.status==='Pendente').length;$('mAnalysis').textContent=all.filter(x=>x.status==='Em análise').length;$('mCalled').textContent=all.filter(x=>x.status==='Convocada').length;$('rows').innerHTML=rows.map(r=>`<tr><td><b>${esc(r.protocolo)}</b></td><td>${new Date(r.criado_em).toLocaleDateString('pt-BR')}</td><td>${esc(r.nome_aluno)}</td><td>${age(r.data_nascimento)}</td><td>${esc(r.unidade_interesse)}</td><td>${esc(r.nome_responsavel)}</td><td>${esc(r.telefone_responsavel)}</td><td><span class="status">${esc(r.status)}</span></td><td><button class="btn-form btn-secondary" onclick="openDetail('${r.id}')">VER</button></td></tr>`).join('')}
window.openDetail=id=>{current=all.find(r=>r.id===id);if(!current)return;$('detailTitle').textContent=current.protocolo+' • '+current.nome_aluno;$('detailStatus').value=current.status;$('adminNotes').value=current.observacao_interna||'';const fields=[['Aluno',current.nome_aluno],['Nascimento',new Date(current.data_nascimento+'T00:00:00').toLocaleDateString('pt-BR')],['Idade',age(current.data_nascimento)],['Escola',current.escola],['Série',current.serie],['Cidade',current.cidade],['Responsável',current.nome_responsavel],['Parentesco',current.parentesco],['CPF responsável',current.cpf_responsavel],['WhatsApp',current.telefone_responsavel],['E-mail',current.email_responsavel],['Endereço',current.endereco+', '+current.numero_endereco],['Bairro',current.bairro],['Unidade',current.unidade_interesse],['Turno',current.turno_preferencial],['Como conheceu',current.como_conheceu],['Já participou',current.participou_anteriormente?'Sim':'Não'],['Observações',current.observacoes||'—']];$('detailGrid').innerHTML=fields.map(x=>`<div class="detail"><b>${esc(x[0])}</b>${esc(x[1])}</div>`).join('');$('modal').style.display='block'};
$('close').onclick=()=>$('modal').style.display='none';$('saveDetail').onclick=async()=>{const {error}=await client.from('inscricoes').update({status:$('detailStatus').value,observacao_interna:$('adminNotes').value,atualizado_em:new Date().toISOString()}).eq('id',current.id);if(error)alert(error.message);else{$('modal').style.display='none';await load()}};
$('loginBtn').onclick=async()=>{if(!PJM_CONFIG.supabaseUrl||PJM_CONFIG.supabaseUrl.includes('COLE_AQUI')){$('loginMsg').textContent='Configure o config.js antes de entrar.';return}client=supabase.createClient(PJM_CONFIG.supabaseUrl,PJM_CONFIG.supabaseAnonKey);const {error}=await client.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){$('loginMsg').textContent=error.message;return}$('login').hidden=true;$('dashboard').hidden=false;const units=[...new Set((await client.from('inscricoes').select('unidade_interesse')).data?.map(x=>x.unidade_interesse)||[])];$('unitFilter').innerHTML='<option value="">Todas as unidades</option>'+units.map(x=>`<option>${esc(x)}</option>`).join('');await load()};$('logout').onclick=async()=>{await client.auth.signOut();location.reload()};$('refresh').onclick=load;['search','statusFilter','unitFilter'].forEach(id=>$(id).addEventListener('input',render));
</script></body></html>
